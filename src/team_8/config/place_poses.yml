# Place/home poses for the manip_challenge environment.
#
# All poses are the tool0 link expressed in base_link (world == base_link).
# tool0 +z is the approach axis; the gripper fingertips are +0.1034 m along +z.
#
#   quat_xyzw [1, 0, 0, 0]         -> tool0 +z points down (top-down drops / home)
#   quat_xyzw [0.5, 0.5, 0.5, 0.5] -> tool0 +z points +x (into the bookshelf)
#
# VALUES BELOW ARE DUMMY PLACEHOLDERS. Real poses are provided separately.

transit_z: 0.80          # safe height for carrying an object laterally

home:      {xyz: [0.55, 0.07, 0.90], quat_xyzw: [1.0, 0.0, 0.0, 0.0]}
storage_1: {xyz: [0.0,  0.55, 0.70], quat_xyzw: [1.0, 0.0, 0.0, 0.0]}
storage_2: {xyz: [0.0, -0.55, 0.70], quat_xyzw: [1.0, 0.0, 0.0, 0.0]}

bookshelf:
  pre_insert:      {xyz: [0.60, -0.30, 0.76], quat_xyzw: [0.5, 0.5, 0.5, 0.5]}
  insert_depth_m:  0.22
  retract_depth_m: 0.22
