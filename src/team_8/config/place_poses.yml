# Place and home poses for the pipeline_orchestrator.
# All target poses are expressed in base_link frame.
# quat_xyzw: quaternion in [x, y, z, w] order.
#
# home_joint_config: six UR5 joint angles [pan, lift, elbow, w1, w2, w3] in
# radians.  The arm returns home by a collision-aware c-space plan so it always
# settles in this exact posture (no IK branch ambiguity).  Set to the
# manip_challenge Gazebo startup pose so homing barely moves the arm and the
# wrist camera has a clear view of the workspace.
# Tune with: ros2 run team_8 home_config_tuner
home_joint_config: [0.0, -1.8, 1.0, -1.0, -1.65, 0.0]

transit_z: 0.45          # safe height (base_link Z) for lateral carry moves
transit_floor_z: 0.0    # floor plane height for transit collision world

# Storage A (right side of workspace, +Y)
storageA_1:
  xyz: [0.069, 0.649, 0.370]
  quat_xyzw: [0.707, -0.707, 0.017, -0.017]

storageA_2:
  xyz: [0.099, 0.439, 0.370]
  quat_xyzw: [0.707, -0.707, 0.017, -0.017]

storageA_3:
  xyz: [-0.021, 0.439, 0.370]
  quat_xyzw: [0.707, -0.707, 0.017, -0.017]

storageA_4:
  xyz: [-0.021, 0.649, 0.370]
  quat_xyzw: [0.707, -0.707, 0.017, -0.017]

# Storage B (left side of workspace, -Y)
storageB_1:
  xyz: [0.069, -0.431, 0.370]
  quat_xyzw: [0.707, -0.707, 0.017, -0.017]

storageB_2:
  xyz: [0.069, -0.611, 0.370]
  quat_xyzw: [0.707, -0.707, 0.017, -0.017]

storageB_3:
  xyz: [-0.051, -0.431, 0.370]
  quat_xyzw: [0.707, -0.707, 0.017, -0.017]

storageB_4:
  xyz: [-0.051, -0.611, 0.370]
  quat_xyzw: [0.707, -0.707, 0.017, -0.017]

# Bookshelf
# pre_insert: staging pose in front of the shelf.
# tool0 +z points +x (into shelf); insert drives -x by insert_depth_m,
# retract pulls +x by retract_depth_m after gripper opens.
# Tune pre_insert xyz with: ros2 run team_8 pose_probe
bookshelf:
  pre_insert:      {xyz: [0.5, -0.3, 0.22], quat_xyzw: [-0.5, 0.5, -0.5, 0.5]}
  insert_depth_m:  0.22
  retract_depth_m: 0.22
