# Place/home poses for the manip_challenge environment.
#
# All poses are the tool0 link expressed in base_link (world == base_link).
# tool0 +z is the approach axis; the gripper fingertips are +0.1034 m along +z.
#
#   quat_xyzw [1, 0, 0, 0]         -> tool0 +z points down (top-down drops / home)
#   quat_xyzw [0.5, 0.5, 0.5, 0.5] -> tool0 +z points +x (into the bookshelf)
#
# Real poses. storage_1/storage_2 are the basket drop points
# (storageA_1 / storageB_1) with a top-down orientation.
#
# home is a fixed JOINT configuration, not an IK pose: the arm returns to it via
# a collision-aware c-space plan, so it always settles in the same posture instead
# of whatever branch free IK happened to pick (which made the arm swing far from
# the Gazebo initial state). Order matches the cuRobo cspace joint_names:
# [pan, lift, elbow, wrist_1, wrist_2, wrist_3].
#
# Set to the manip_challenge Gazebo startup pose (init_joints.py sends
# [0, -pi/2, 1, -pi/3, -pi/2, 0]): the arm starts here, so homing barely moves it,
# and this raised/extended posture lets the wrist camera see the whole storage
# (the more-tucked cuRobo default didn't cover it). Tune with
# `ros2 run team_8 home_config_tuner` against the live sim.
home_joint_config: [ 0.0, -1.8, 1.0, -1.0, -1.65, 0.0]

# Lateral carry height. Capped by UR5 reach: at storage_1's xy radius (~0.65 m)
# cuRobo IK reaches up to z~0.60; 0.80 was unreachable and broke the lift leg.
# Lowered to 0.45 (must stay above the storage drop z=0.37): the arm is now kept
# off the table by transit_floor_z below, so the carry no longer has to be high,
# and a lower carry eases reach for far grasps. The lift leg auto-lowers further
# when even this is unreachable (see CuRobo._plan_lift_leg).
transit_z: 0.45          # safe height for carrying an object laterally

# Ground-plane floor for the carried-object transit, in base_link z. The transit
# is collision-OFF for the held object, but cuRobo still checks every arm link
# against a flat cuboid whose top sits at this z, so the arm can't drop through
# the table. Set to the table-top height (raise it for more clearance over short
# objects; keep it below the storage drop z=0.37 so it never blocks the descent).
transit_floor_z: 0.0

storage_1: {xyz: [0.000000,  0.550000, 0.370337], quat_xyzw: [1.0, 0.0, 0.0, 0.0]}
storage_2: {xyz: [0.000000, -0.550000, 0.370327], quat_xyzw: [1.0, 0.0, 0.0, 0.0]}

# bookshelf/shelf pose. pre_insert is the staging pose in front of the shelf;
# tool0 +z points +x (into the shelf) so the insert leg drives +x by
# insert_depth_m, then retract_depth_m pulls back along -x after release.
bookshelf:
  pre_insert:      {xyz: [0.5, -0.3, 0.22], quat_xyzw: [-0.5, 0.5, -0.5, 0.5]}
  insert_depth_m:  0.22
  retract_depth_m: 0.22
