services:
  ai_planner:
    build:
      context: .
    network_mode: host
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
      FASTRTPS_DEFAULT_PROFILES_FILE: /ros2_ws/config/fastdds_no_shm.xml
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GRASPGENX_REPO_DIR: /opt/GraspGenX
      GRASPGENX_CHECKPOINT_DIR: /opt/GraspGenXModel/release
      GRASPGENX_GRIPPER: robotiq_2f_85
    volumes:
      - ./artifacts:/artifacts
      - ./config:/ros2_ws/config:ro
      - torch_cache:/root/.cache/torch
      - triton_cache:/root/.triton
      - graspgen_ext:/opt/GraspGenX/ext
    ipc: host
    stdin_open: true
    tty: true
    command: ["ros2", "launch", "pipeline_orchestrator", "deploy.launch.py"]

volumes:
  torch_cache:
  triton_cache:
  graspgen_ext:
