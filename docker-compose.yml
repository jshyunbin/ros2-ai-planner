services:
  ai_planner:
    build:
      context: .
      args:
        PLANNER_BASE_IMAGE: ${PLANNER_BASE_IMAGE:-ros2-ai-planner-base:latest}
        GRASPGEN_REPO_URL: https://github.com/pianojay/GraspGen.git
        GRASPGEN_BRANCH: jaeuk
    network_mode: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - GRASPGEN_REPO_DIR=/opt/GraspGen
      - GRASPGEN_MODELS_DIR=/opt/GraspGenModels
    volumes:
      - ./src:/ros2_ws/src
      - ./segmented_objects:/ros2_ws/segmented_objects:ro
      - ../GraspGenModels:/opt/GraspGenModels:ro
    ipc: host
    stdin_open: true
    tty: true
