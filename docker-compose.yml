services:
  ai_planner:
    image: image_team_8:latest
    build:
      context: .
      args:
        # Read from .env in the build environment and baked into the image,
        # so no extra build flag is needed. Never committed (key lives in .env).
        GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    network_mode: host
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
      FASTRTPS_DEFAULT_PROFILES_FILE: /ros2_ws/config/fastdds_no_shm.xml
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GRASPGEN_REPO_DIR: /opt/GraspGen
      GRASPGEN_MODELS_DIR: /opt/GraspGenModels
    volumes:
      - ./artifacts:/artifacts
      - ./config:/ros2_ws/config:ro
    ipc: host
    stdin_open: true
    tty: true
    command: ["ros2", "launch", "pipeline_orchestrator", "deploy.launch.py"]
